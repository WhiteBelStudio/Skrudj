[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skrudj"
version = "0.1.0"
description = "Unified Telegram and VK marketplace for WhiteBelStudio"
requires-python = ">=3.12"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["skrudj"]

[tool.ruff.lint.per-file-ignores]
"src/skrudj/__main__.py" = ["I001"]

[tool.vercel]
entrypoint = "api.vk.callback:handler"
